
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="weather-card">
    <h1>Weather App</h1>
    <p>Discover the weather in your city</p>

    <form id="weather-form">
      <input
        id="city-input"
        type="text"
        placeholder="Enter city name"
        aria-label="City name"
        required
      >
      <button type="submit">Search</button>
    </form>

    <p id="message" role="status">Search for a city to begin.</p>

    <section id="weather-result" hidden>
      <h2 id="city-name"></h2>
      <div id="weather-icon">🌤️</div>
      <p id="description"></p>
      <p class="temperature"><span id="temperature"></span>°C</p>

      <div class="details">
        <div>
          <span>Humidity</span>
          <strong id="humidity"></strong>
        </div>
        <div>
          <span>Wind speed</span>
          <strong id="wind"></strong>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
